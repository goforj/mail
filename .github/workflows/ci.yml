name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            mailses/go.sum
            examples/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Check every module against staged siblings
        env:
          MAIL_LOCAL_SIBLINGS: "1"
        run: scripts/check-quality.sh

      - name: Verify generated examples and API docs
        if: matrix.go == '1.24.x'
        run: |
          go run ./docs/examplegen/main.go
          go run ./docs/readme/main.go
          go run ./docs/readme/testcounts/main.go
          git diff --exit-code -- README.md examples

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            go.sum
            mailses/go.sum

      - name: Run root race tests
        run: GOWORK=off go test -count=1 -race ./...

      - name: Run staged SES race tests
        run: cd mailses && go test -count=1 -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            go.sum
            mailses/go.sum

      - name: Run combined coverage
        run: bash scripts/coverage-codecov.sh

      - name: Enforce and report coverage
        run: |
          TOTAL="$(awk -F'[: ]+' 'NR>1 {covered += ($4 > 0 ? $3 : 0); total += $3} END {printf "%.1f", (covered/total)*100}' coverage.txt)"
          awk -v total="$TOTAL" 'BEGIN {if (total < 90.0) exit 1}'
          echo "Merged coverage: ${TOTAL}%"
          {
            echo "## Coverage"
            echo
            echo "- Merged total: ${TOTAL}%"
            echo "- Required floor: 90.0%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
